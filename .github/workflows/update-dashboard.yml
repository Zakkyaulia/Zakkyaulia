name: Update GitHub Profile Dashboard

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab
  push:
    branches:
      - main
    paths:
      - 'config/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Regenerate Dashboard Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_dashboard.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage updated assets and cached processed statistics
          git add assets/github-dashboard.svg data/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes detected in dashboard SVG or data. Skipping commit."
          else
            git commit -m "chore(dashboard): auto-update statistics and SVG [skip ci]"
            git push
            echo "Successfully committed and pushed updated dashboard assets."
          fi
